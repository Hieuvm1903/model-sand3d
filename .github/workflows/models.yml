name: build-models

on:
  push:
    branches: [main]
    paths: ["models/**", "lib/**", "tools/**", "requirements.txt", ".github/workflows/models.yml"]
  pull_request:
    paths: ["models/**", "lib/**", "tools/**", "requirements.txt"]
  workflow_dispatch:

concurrency:
  group: build-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # sand3d supports 3.11 and 3.13 (not 3.12)
          cache: pip

      - run: pip install -r requirements.txt

      # Every push and PR: build all models, so a broken script fails the check.
      - name: Build models
        run: python tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: dist/
          retention-days: 14

      # Only on main (PRs from forks have no secrets anyway).
      - name: Publish to Supabase
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python tools/build.py --upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
